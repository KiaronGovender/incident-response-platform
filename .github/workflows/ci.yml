name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: autonomous-incident-response
  REGION: europe-west1
  REPOSITORY: incident-response
  IMAGE_NAME: incident-response-platform

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Test FastAPI Backend & AI Investigation Agents
  # ----------------------------------------------------------------------------
  test-backend:
    name: Test Backend & AI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: sqlite:///./test_ci.db
        run: |
          python -m pytest -v

  # ----------------------------------------------------------------------------
  # Job 2: Test Next.js Frontend & TypeScript Build
  # ----------------------------------------------------------------------------
  test-frontend:
    name: Test Frontend & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Next.js Static Export
        working-directory: ./frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Build Multi-Stage Docker Image (Pull Requests)
  # ----------------------------------------------------------------------------
  build-check:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry run)
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:test .

  # ----------------------------------------------------------------------------
  # Job 4: Build, Push to Artifact Registry, and Deploy to Cloud Run (Main branch)
  # ----------------------------------------------------------------------------
  deploy:
    name: Build, Push and Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1081677184050/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@autonomous-incident-response.iam.gserviceaccount.com

      - name: Set up Docker authentication
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Unified Multi-Stage Docker image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Google Cloud Run
        run: |
          gcloud run deploy ${{ env.IMAGE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
